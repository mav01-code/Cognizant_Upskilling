<form style="margin: auto; width: 200px; padding: 20px">
    <label>Name</label>
    <input type = "text" placeholder="Enter your full name" required autofocus/><br>
    <label>Email</label>
    <input type="email" placeholder="Eg: a@gmail.com" required/><br>
    <label>Date</label>
    <input type="date" placeholder="select event date" required/><br>
    <label>Event Type</label>
    <select>
        <option>Festival</option>
        <option>Birthday</option>
        <option>Anniversary</option>
        <option>Marriage</option>
    </select><br>
    <label>Message</label>
    <textarea placeholder="Enter any extra details"></textarea><br><br>
    <button type="submit">Submit</button><br>
    <output>Submitted</output>
</form>
