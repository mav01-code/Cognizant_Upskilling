<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML5</title>
    <style>
        #welcomeBanner {
            background-color: blue;
        }

        .highlight {
            background-color: darkgray;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <li><a href="#home">Home</a></li>
        <li><a href="#events">Events</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="help.html" target="_blank">Help</a></li>
    </nav>
    <section id="home">
        <div id="welcomeBanner">
            <p><span style="color: red; font-weight: bold;">Special Offer</span></p>
            <div class="highlight">Certain elements for visual analysis</div>
        </div>
    </section>
    <section id="events">
        <table>
            <caption>Events</caption>
            <tr>
                <td>
                    <img src="Event1.png" alt="Ugadi Picture" title="Ugadi Event"
                        style="height: 300px; width: 100%; border:1px solid black;" />
                    <p>Ugadi</p>
                </td>
                <td>
                    <img src="Event2.png" alt="Sankranthi Picture" title="Sankranthi Event"
                        style="height: 300px; width: 100%; border:1px solid black" />
                    <p>Sankranthi</p>
                </td>
                <td>
                    <img src="Event3.png" alt="Rama Navami Picture" title="Rama Navami Event"
                        style="height: 300px; width: 100%; border:1px solid black" />
                    <p>Sri Rama Navami</p>
                </td>
            </tr>
            <tr>
                <td>
                    <img src=" Event4.png" alt="Vinayaka Chavithi Picture" title="Chavithi Event"
                        style="height: 300px; width: 100%; border:1px solid black" />
                    <p>Vinayaka Chavithi</p>
                </td>
                <td>
                    <img src="Event5.png" alt="Navratri Picture" title="Navratri Event"
                        style="height: 300px; width: 100%; border:1px solid black" />
                    <p>Navratri</p>
                </td>
                <td>
                    <img src="Event6.png" alt="Diwali Picture" title="Diwali Event"
                        style="height: 300px; width: 100%; border:1px solid black" />
                    <p>Deepawali</p>
                </td>
            </tr>
        </table>
    </section>
    <form style="margin: auto; width: 200px; padding: 20px">
        <label>Name</label>
        <input type="text" placeholder="Enter your full name" required autofocus /><br>
        <label>Email</label>
        <input type="email" placeholder="Eg: a@gmail.com" required /><br>
        <label>Date</label>
        <input type="date" placeholder="select event date" required /><br>
        <label>Event Type</label>
        <select>
            <option>Festival</option>
            <option>Birthday</option>
            <option>Anniversary</option>
            <option>Marriage</option>
        </select><br>
        <label>Message</label>
        <textarea placeholder="Enter any extra details"></textarea><br><br>
        <button type="submit">Submit</button><br>
        <output>Submitted</output>
    </form>
    <h3>Feedback Form</h3>
    <form>
        <label>Phone number: </label>
        <input id = "phone" type = "text" onblur="validatePhone()"/><br>
        <label>Event Type: </label>
        <select id = "eventType" onchange="showFee()">
            <option>Festival</option>
            <option>Birthday</option>
            <option>Anniversary</option>
        </select><br>
        <p id = "fee"></p>
        <br>
        <label>Feedback: </label>
        <textarea id = "feedback" onkeyup="countCharacters()"></textarea><br>
        <p>Characters: <span id = "count">0</span></p>    
        <br>
        <button type="button" onclick="showConfirmation()">Submit</button>
        <output id = "output"></output>
    </form>
    <img src = "Event1.png" id = "eventImg" ondblclick="enlargeImg()"/>
    <h3>Event Promo Video</h3>
    <video id = "video" width="500" controls>
        <source src = "Video.mp4" type="video/mp4">
    </video>
    <p id = "message"></p>
    <section id="contact"></section>
    <!-- Main -->
    <!-- Footer -->
</body>

<script>
    function validatePhone(){
        let phone = document.getElementById("phone").value;
        if(phone.length == 10){
            alert("Valid phone number");
        }
        else{
            alert("Invalid phone number");
        }
    }
    function showFee(){
        let eventType = document.getElementById("eventType").value;
        let fee = document.getElementById("fee");
        if(eventType == "Festival"){
            fee.innerHTML = "Fee: 100";
        }
        else if(eventType == "Birthday"){
            fee.innerHTML = "Fee: 150";
        }
        else{
            fee.innerHTML = "Fee: 200";
        }
    }
    function countCharacters(){
        let feedback = document.getElementById("feedback").value;
        document.getElementById("count").innerHTML = feedback.length;
    }
    let formSubmission = false;
    function showConfirmation(){
        document.getElementById("output").innerHTML = "Feedback submitted successfully";
        formSubmission = true;
    }
    function enlargeImg(){
        document.getElementById("eventImg").style.width = "1000px";
    }
    const video = document.getElementById("video");
        video.oncanplay = function(){
            document.getElementById("message").textContent = "Video ready to play";
    };

    window.onbeforeunload = function(e){
        if(!formSubmission){
            e.preventDefault();
            e.returnValue = "";
        }
    }
</script>
</html>
